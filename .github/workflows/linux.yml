name: Linux

on:
  push:
  pull_request:

jobs:
  arch-build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: >-
          pacman -Syu --noconfirm --needed cmake ninja gcc pkgconf python
          speech-dispatcher rubberband onnxruntime-cpu ffmpeg python-gobject gtk4
          xorg-server-xvfb xorg-xwininfo imagemagick
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Validate release metadata
        run: |
          python scripts/catalog/build_catalog.py --piper-source catalog/sources/piper.json --check
          python scripts/release-audit.py --ci
          bash -n install.sh scripts/install-debian scripts/install-source packaging/debian/build-deb
      - name: Smoke-test deterministic screenshot capture
        run: |
          scripts/capture-linux-screenshots "$RUNNER_TEMP/uttermux-screenshots"
          test "$(find "$RUNNER_TEMP/uttermux-screenshots" -name 'linux-*.png' | wc -l)" -eq 4

  portable-prefix:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - run: pacman -Syu --noconfirm --needed cmake ninja gcc pkgconf speech-dispatcher rubberband
      - run: >-
          cmake -S . -B build-prefix -G Ninja -DBUILD_TESTING=OFF
          -DCMAKE_INSTALL_PREFIX=/opt/uttermux -DCMAKE_INSTALL_LIBDIR=lib64
      - run: cmake --build build-prefix
      - run: DESTDIR="$PWD/stage" cmake --install build-prefix
      - run: test -x stage/opt/uttermux/lib64/uttermux/uttermuxd
      - run: grep -F 'ExecStart=/opt/uttermux/lib64/uttermux/uttermuxd' stage/opt/uttermux/lib/systemd/user/uttermux.service

  debian-build:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: apt-get update
      - name: Install dependencies
        run: >-
          apt-get install -y --no-install-recommends git ca-certificates cmake ninja-build
          g++ pkg-config python3 libspeechd-dev libspeechd-module0
          librubberband-dev ffmpeg
      - uses: actions/checkout@v7
      - run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DSPEECHD_MODULE_DIR=/usr/lib/speech-dispatcher-modules
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: DESTDIR="$PWD/stage" cmake --install build
      - run: test -x stage/usr/lib/speech-dispatcher-modules/sd_uttermux
