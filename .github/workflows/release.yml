name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  source-release:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install Git for repository checkout
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Trust the checked-out runner workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: >-
          pacman -Syu --noconfirm --needed cmake ninja gcc pkgconf python
          speech-dispatcher rubberband onnxruntime-cpu ffmpeg github-cli
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: python scripts/release-audit.py --ci
      - name: Create deterministic source archive
        run: |
          archive="uttermux-linux-${GITHUB_REF_NAME#v}.tar"
          git archive --format=tar --prefix="uttermux-linux-${GITHUB_REF_NAME#v}/" --output="$archive" "$GITHUB_REF_NAME"
          gzip -n "$archive"
          tar -tzf "$archive.gz" | grep -q "^uttermux-linux-${GITHUB_REF_NAME#v}/README.md$"
          sha256sum "uttermux-linux-${GITHUB_REF_NAME#v}.tar.gz" > SHA256SUMS
      - name: Resolve Arch package checksums
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          package_version="${release_version//-/_}"
          project_sha=$(sha256sum "uttermux-linux-${GITHUB_REF_NAME#v}.tar.gz" | cut -d' ' -f1)
          curl -fL --retry 3 -o sherpa-onnx-1.13.6.tar.gz https://github.com/k2-fsa/sherpa-onnx/archive/refs/tags/v1.13.6.tar.gz
          sherpa_sha=$(sha256sum sherpa-onnx-1.13.6.tar.gz | cut -d' ' -f1)
          sed -e "s/PACKAGE_VERSION/$package_version/" \
              -e "s/RELEASE_VERSION/$release_version/" \
              -e "s/RELEASE_TAG/$GITHUB_REF_NAME/" \
              -e "s/PROJECT_SHA256/$project_sha/" \
              -e "s/SHERPA_SHA256/$sherpa_sha/" packaging/arch/PKGBUILD.in > PKGBUILD
          ! grep -Eq 'PACKAGE_VERSION|RELEASE_VERSION|RELEASE_TAG|PROJECT_SHA256|SHERPA_SHA256|(^|[^A-Z])SKIP([^A-Z]|$)' PKGBUILD
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "uttermux-linux-${GITHUB_REF_NAME#v}.tar.gz" SHA256SUMS PKGBUILD
          --repo "$GITHUB_REPOSITORY" --prerelease --generate-notes

  arch-package:
    needs: source-release
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install package dependencies
        run: >-
          pacman -Syu --noconfirm --needed git sudo speech-dispatcher libspeechd
          rubberband python python-gobject gtk4 python-numpy python-aiohttp
          python-certifi python-tabulate python-typing_extensions curl ffmpeg libpulse onnxruntime-cpu espeak-ng cmake
          ninja gcc pkgconf github-cli
      - name: Download release PKGBUILD
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern PKGBUILD
      - name: Build as an unprivileged package user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && UTTERMUX_BUILD_JOBS=2 makepkg --cleanbuild --noconfirm --nodeps"
          package=$(find . -maxdepth 1 -name 'uttermux-*.pkg.tar.zst' -print -quit)
          test -n "$package"
          mv "$package" "uttermux-${GITHUB_REF_NAME#v}-arch-x86_64.pkg.tar.zst"
          sha256sum "uttermux-${GITHUB_REF_NAME#v}-arch-x86_64.pkg.tar.zst" > "uttermux-${GITHUB_REF_NAME#v}-arch-x86_64.pkg.tar.zst.sha256"
      - name: Upload Arch package
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          "uttermux-${GITHUB_REF_NAME#v}-arch-x86_64.pkg.tar.zst"
          "uttermux-${GITHUB_REF_NAME#v}-arch-x86_64.pkg.tar.zst.sha256"
          --repo "$GITHUB_REPOSITORY" --clobber

  debian-package:
    needs: source-release
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install build and package dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl cmake ninja-build g++ pkg-config python3 python3-pip dpkg-dev libspeechd-dev libspeechd-module0 librubberband-dev ffmpeg gh
      - uses: actions/checkout@v7
      - name: Build Debian package
        run: packaging/debian/build-deb "${GITHUB_REF_NAME#v}" "$GITHUB_WORKSPACE/dist"
      - name: Upload Debian package
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          "dist/uttermux-${GITHUB_REF_NAME#v}-debian-amd64.deb"
          "dist/uttermux-${GITHUB_REF_NAME#v}-debian-amd64.deb.sha256"
          --repo "$GITHUB_REPOSITORY" --clobber
